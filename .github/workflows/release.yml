# Multi-platform desktop builds → GitHub Release (tag v*).
# Repo: https://github.com/hakuzero4/LRSS
#
# Trigger:
#   git tag v0.1.0 && git push origin v0.1.0
# Or: Actions → Release → Run workflow
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create/update a GitHub Release from this run"
        type: boolean
        default: false

permissions:
  contents: write

env:
  APP_NAME: lrss
  NODE_VERSION: "20"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # —— Windows ——
          - name: Windows amd64
            os: windows-latest
            kind: binary
            goos: windows
            goarch: amd64
            artifact: lrss-windows-amd64.exe
            out_name: lrss.exe

          - name: Windows arm64
            os: windows-latest
            kind: binary
            goos: windows
            goarch: arm64
            artifact: lrss-windows-arm64.exe
            out_name: lrss.exe

          # —— Linux ——
          - name: Linux amd64
            os: ubuntu-latest
            kind: binary
            goos: linux
            goarch: amd64
            artifact: lrss-linux-amd64
            out_name: lrss

          # —— macOS (native runners, .app bundles) ——
          - name: macOS arm64
            os: macos-latest
            kind: macos-app
            goos: darwin
            goarch: arm64
            artifact: LRSS-macOS-arm64
            # zip will be LRSS-macOS-arm64.app.zip

          - name: macOS amd64
            os: macos-latest
            kind: macos-app
            goos: darwin
            goarch: amd64
            artifact: LRSS-macOS-amd64

          - name: macOS universal
            os: macos-latest
            kind: macos-universal
            goos: darwin
            goarch: universal
            artifact: LRSS-macOS-universal

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Linux: install GUI/CGO deps BEFORE anything that may probe pkg-config.
      # Wails v3 needs GTK4 + WebKitGTK 6.0 on recent Ubuntu (not only GTK3/4.1).
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            gcc \
            libgtk-3-dev \
            libgtk-4-dev \
            libwebkit2gtk-4.1-dev \
            libwebkitgtk-6.0-dev \
            libayatana-appindicator3-dev \
            libglib2.0-dev
          # Sanity: required .pc files for Wails / WebView
          pkg-config --exists gtk4 && echo "gtk4 ok"
          pkg-config --exists webkitgtk-6.0 && echo "webkitgtk-6.0 ok" \
            || pkg-config --exists webkit2gtk-4.1 && echo "webkit2gtk-4.1 ok"

      - name: Install Wails v3 CLI
        # CLI itself does not need CGO; pure-Go install avoids pkg-config on all OSes.
        env:
          CGO_ENABLED: "0"
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      # ── Windows / Linux: bare binary ─────────────────────────────────
      - name: Build binary
        if: matrix.kind == 'binary'
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.goos == 'windows' && '0' || '1' }}
        run: |
          set -euo pipefail
          case "${{ matrix.goos }}" in
            windows) wails3 task windows:build ARCH=${{ matrix.goarch }} ;;
            linux)   wails3 task linux:build ARCH=${{ matrix.goarch }} ;;
            *) echo "unexpected goos"; exit 1 ;;
          esac

      - name: Stage binary artifact
        if: matrix.kind == 'binary'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          src="bin/${{ matrix.out_name }}"
          if [[ ! -f "$src" ]]; then
            echo "Missing build output: $src"
            ls -la bin/ || true
            find bin -type f 2>/dev/null || true
            exit 1
          fi
          cp "$src" "dist/${{ matrix.artifact }}"
          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            if command -v powershell.exe >/dev/null 2>&1; then
              powershell.exe -NoProfile -Command "Compress-Archive -Path 'dist/${{ matrix.artifact }}' -DestinationPath 'dist/${{ matrix.artifact }}.zip' -Force"
            else
              (cd dist && zip -9 "${{ matrix.artifact }}.zip" "${{ matrix.artifact }}")
            fi
          else
            chmod +x "dist/${{ matrix.artifact }}"
            tar -C dist -czf "dist/${{ matrix.artifact }}.tar.gz" "${{ matrix.artifact }}"
          fi
          ls -la dist/

      # ── macOS: .app bundle (ad-hoc signed) ──────────────────────────
      - name: Build macOS .app
        if: matrix.kind == 'macos-app'
        shell: bash
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          # package = build + create .app + ad-hoc codesign on macOS runners
          wails3 task darwin:package ARCH=${{ matrix.goarch }}
          test -d "bin/lrss.app"
          ls -laR bin/lrss.app | head -50

      - name: Build macOS universal .app
        if: matrix.kind == 'macos-universal'
        shell: bash
        env:
          GOOS: darwin
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          wails3 task darwin:package:universal
          test -d "bin/lrss.app"
          file bin/lrss.app/Contents/MacOS/lrss || true
          ls -laR bin/lrss.app | head -50

      - name: Stage macOS .app zip
        if: matrix.kind == 'macos-app' || matrix.kind == 'macos-universal'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # Rename bundle for clear download names
          rm -rf "dist/${{ matrix.artifact }}.app"
          cp -R bin/lrss.app "dist/${{ matrix.artifact }}.app"
          # ditto preserves resource forks / signing better than zip alone on macOS
          if command -v ditto >/dev/null 2>&1; then
            ditto -c -k --sequesterRsrc --keepParent \
              "dist/${{ matrix.artifact }}.app" \
              "dist/${{ matrix.artifact }}.app.zip"
          else
            (cd dist && zip -ry "${{ matrix.artifact }}.app.zip" "${{ matrix.artifact }}.app")
          fi
          ls -la dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: >
      startsWith(github.ref, 'refs/tags/v')
      || (github.event_name == 'workflow_dispatch' && inputs.create_release)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten release files
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f | sort
          while IFS= read -r -d '' f; do
            base="$(basename "$f")"
            case "$base" in
              *.zip|*.tar.gz|*.exe|lrss-*|LRSS-*)
                cp -v "$f" "release/$base"
                ;;
            esac
          done < <(find artifacts -type f -print0)

          ls -la release/
          test "$(find release -type f | wc -l)" -gt 0

          (
            cd release
            sha256sum * > SHA256SUMS.txt
            cat SHA256SUMS.txt
          )

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('draft-{0}', github.run_id) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Draft build {0}', github.run_id) }}
          draft: ${{ !startsWith(github.ref, 'refs/tags/') }}
          generate_release_notes: true
          files: release/*
          body: |
            ## LRSS ${{ github.ref_name }}

            Multi-platform desktop builds (Wails v3).

            | Asset | Platform |
            | --- | --- |
            | `lrss-windows-amd64.exe` / `.zip` | Windows x64 |
            | `lrss-windows-arm64.exe` / `.zip` | Windows ARM64 |
            | `lrss-linux-amd64` / `.tar.gz` | Linux x64 |
            | `LRSS-macOS-arm64.app.zip` | **macOS Apple Silicon (M1/M2/M3…)** |
            | `LRSS-macOS-amd64.app.zip` | **macOS Intel** |
            | `LRSS-macOS-universal.app.zip` | **macOS Universal** (arm64 + amd64) |
            | `SHA256SUMS.txt` | Checksums |

            ### macOS
            1. Download `LRSS-macOS-*.app.zip` and unzip.
            2. Drag `LRSS-macOS-*.app` to Applications (optional).
            3. First launch: right-click → **Open** (unsigned CI builds; Gatekeeper).
            4. Prefer **Apple Silicon** on M-series Macs; use **universal** if unsure.

            ### Linux
            Runtime needs WebKitGTK (e.g. `libwebkit2gtk-4.1-0` on recent Ubuntu/Debian).

            Source: https://github.com/hakuzero4/LRSS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
