# Multi-platform desktop builds → GitHub Release (tag v*).
# Repo: https://github.com/hakuzero4/LRSS
#
# Trigger:
#   git tag v0.1.0 && git push origin v0.1.0
# Or: Actions → Release → Run workflow
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create/update a GitHub Release from this run"
        type: boolean
        default: false

permissions:
  contents: write

env:
  APP_NAME: lrss
  NODE_VERSION: "22"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # —— Windows ——
          - name: Windows amd64
            os: windows-latest
            kind: binary
            goos: windows
            goarch: amd64
            out_name: lrss.exe

          - name: Windows arm64
            os: windows-latest
            kind: binary
            goos: windows
            goarch: arm64
            out_name: lrss.exe

          # —— Linux ——
          - name: Linux amd64
            os: ubuntu-latest
            kind: binary
            goos: linux
            goarch: amd64
            out_name: lrss

          # —— macOS (.app; single-arch only — universal was ~50m+: 2× build + slow UPX) ——
          - name: macOS arm64
            os: macos-latest
            kind: macos-app
            goos: darwin
            goarch: arm64

          - name: macOS amd64
            os: macos-latest
            kind: macos-app
            goos: darwin
            goarch: amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            ver="${GITHUB_REF_NAME#v}"
          else
            ver="$(sed -n 's/^export const APP_VERSION = "\(.*\)";/\1/p' frontend/src/lib/appMeta.ts | head -n1)"
          fi
          if [[ -z "${ver}" ]]; then
            echo "could not resolve version" >&2
            exit 1
          fi
          echo "version=${ver}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${ver}"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Linux: install GUI/CGO deps BEFORE anything that may probe pkg-config.
      # Wails v3 needs GTK4 + WebKitGTK 6.0 on recent Ubuntu (not only GTK3/4.1).
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            gcc \
            libgtk-3-dev \
            libgtk-4-dev \
            libwebkit2gtk-4.1-dev \
            libwebkitgtk-6.0-dev \
            libayatana-appindicator3-dev \
            libglib2.0-dev
          # Sanity: required .pc files for Wails / WebView
          pkg-config --exists gtk4 && echo "gtk4 ok"
          pkg-config --exists webkitgtk-6.0 && echo "webkitgtk-6.0 ok" \
            || pkg-config --exists webkit2gtk-4.1 && echo "webkit2gtk-4.1 ok"

      - name: Install Wails v3 CLI
        # CLI itself does not need CGO; pure-Go install avoids pkg-config on all OSes.
        env:
          CGO_ENABLED: "0"
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      # UPX on Windows + Linux to keep release artifacts small (~½).
      # macOS: skip (Mach-O UPX is slow/unreliable; .app.zip is enough).
      - name: Install UPX (Windows / Linux)
        if: runner.os != 'macOS'
        uses: crazy-max/ghaction-upx@v3
        with:
          version: v5.0.1
          install-only: true

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      # ── Windows / Linux: bare binary ─────────────────────────────────
      - name: Build binary
        if: matrix.kind == 'binary'
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.goos == 'windows' && '0' || '1' }}
        run: |
          set -euo pipefail
          case "${{ matrix.goos }}" in
            windows) wails3 task windows:build ARCH=${{ matrix.goarch }} ;;
            linux)   wails3 task linux:build ARCH=${{ matrix.goarch }} ;;
            *) echo "unexpected goos"; exit 1 ;;
          esac

      - name: UPX compress binary
        if: matrix.kind == 'binary'
        shell: bash
        run: |
          set -euo pipefail
          src="bin/${{ matrix.out_name }}"
          test -f "$src"
          before=$(wc -c < "$src" | tr -d ' ')
          # -9 is far faster than --best --lzma on large Go binaries; still ~½ size.
          # --force: required for many Go binaries (PT_LOAD layout)
          # Windows arm64: soft-fail if this UPX build cannot pack the arch.
          if upx -9 --force "$src"; then
            after=$(wc -c < "$src" | tr -d ' ')
            pct=$(( after * 100 / before ))
            echo "UPX: ${before} → ${after} bytes (${pct}% of original)"
          else
            echo "UPX failed for ${{ matrix.goos }}/${{ matrix.goarch }}; shipping uncompressed."
            if [[ "${{ matrix.goarch }}" == "arm64" ]]; then
              exit 0
            fi
            exit 1
          fi

      - name: Stage binary artifact
        if: matrix.kind == 'binary'
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          src="bin/${{ matrix.out_name }}"
          if [[ ! -f "$src" ]]; then
            echo "Missing build output: $src"
            ls -la bin/ || true
            find bin -type f 2>/dev/null || true
            exit 1
          fi
          base="lrss-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            dest="${base}.exe"
            cp "$src" "dist/${dest}"
            if command -v powershell.exe >/dev/null 2>&1; then
              powershell.exe -NoProfile -Command "Compress-Archive -Path 'dist/${dest}' -DestinationPath 'dist/${base}.zip' -Force"
            else
              (cd dist && zip -9 "${base}.zip" "${dest}")
            fi
          else
            dest="${base}"
            cp "$src" "dist/${dest}"
            chmod +x "dist/${dest}"
            tar -C dist -czf "dist/${dest}.tar.gz" "${dest}"
          fi
          ls -la dist/

      # ── macOS: single-arch .app (no UPX — .app.zip is enough) ───────
      - name: Build macOS .app
        if: matrix.kind == 'macos-app'
        shell: bash
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          # package = build + create .app + ad-hoc codesign
          wails3 task darwin:package ARCH=${{ matrix.goarch }}
          test -d "bin/lrss.app"
          ls -laR bin/lrss.app | head -40

      - name: Stage macOS .app zip
        if: matrix.kind == 'macos-app'
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          zipname="LRSS-${VERSION}-macOS-${{ matrix.goarch }}.app.zip"
          # Keep LRSS.app inside the zip so Finder still shows a normal app name.
          stage="$(mktemp -d)"
          cp -R bin/lrss.app "${stage}/LRSS.app"
          if command -v ditto >/dev/null 2>&1; then
            ditto -c -k --sequesterRsrc --keepParent \
              "${stage}/LRSS.app" \
              "dist/${zipname}"
          else
            (cd "${stage}" && zip -ry "${OLDPWD}/dist/${zipname}" "LRSS.app")
          fi
          ls -la dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}-${{ steps.meta.outputs.version }}
          path: |
            dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: >
      startsWith(github.ref, 'refs/tags/v')
      || (github.event_name == 'workflow_dispatch' && inputs.create_release)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten release files
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f | sort
          while IFS= read -r -d '' f; do
            base="$(basename "$f")"
            case "$base" in
              *.zip|*.tar.gz|*.exe|lrss-*|LRSS-*)
                cp -v "$f" "release/$base"
                ;;
            esac
          done < <(find artifacts -type f -print0)

          ls -la release/
          test "$(find release -type f | wc -l)" -gt 0

          (
            cd release
            sha256sum * > SHA256SUMS.txt
            cat SHA256SUMS.txt
          )

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('draft-{0}', github.run_id) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Draft build {0}', github.run_id) }}
          draft: ${{ !startsWith(github.ref, 'refs/tags/') }}
          generate_release_notes: true
          files: release/*
          body: |
            ## LRSS ${{ github.ref_name }}

            Multi-platform desktop builds (Wails v3).
            **Windows and Linux** binaries are **UPX**-packed (`-9`, ~½ size). macOS ships as `.app.zip` only.

            | Asset | Platform |
            | --- | --- |
            | `lrss-<version>-windows-amd64.exe` / `.zip` | Windows x64 (UPX) |
            | `lrss-<version>-windows-arm64.exe` / `.zip` | Windows ARM64 (UPX when supported) |
            | `lrss-<version>-linux-amd64` / `.tar.gz` | Linux x64 (UPX) |
            | `LRSS-<version>-macOS-arm64.app.zip` | **macOS Apple Silicon** |
            | `LRSS-<version>-macOS-amd64.app.zip` | **macOS Intel** |
            | `SHA256SUMS.txt` | Checksums |

            ### Windows (SmartScreen)
            Builds are **unsigned**. SmartScreen may say “Windows protected your PC”.
            Click **More info** → **Run anyway**. A paid Authenticode certificate is required to remove this permanently.

            ### macOS
            1. Download `LRSS-macOS-*.app.zip` and unzip.
            2. Drag to Applications (optional).
            3. First launch: right-click → **Open** if Gatekeeper blocks.

            ### Linux
            Runtime needs WebKitGTK (e.g. `libwebkit2gtk-4.1-0` on recent Ubuntu/Debian).

            Source: https://github.com/hakuzero4/LRSS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
